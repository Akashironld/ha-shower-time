name: Release

# Push a tag like v0.11.0 and this publishes the GitHub release, with the notes from CHANGELOG.md.
# It refuses when the tag does not match the version in manifest.json or the changelog has no section for it.
# Run it by hand (Actions → Release → Run workflow) to rewrite the notes of a release from the changelog, or to
# publish one whose tag is there but whose release is missing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to rewrite the notes of, e.g. v0.11.1"
        required: true

permissions:
  contents: write

# one run per release at a time: GitHub sometimes starts a tag push twice, and the second then found the release
# already made and failed
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version and take the release notes from the changelog
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/release_notes.py "${tag}" > notes.md
          echo "title=$(head -n 1 notes.md)" >> "$GITHUB_OUTPUT"
          tail -n +3 notes.md > body.md
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            version="$(python3 -c 'import json;print(json.load(open("custom_components/shower_time/manifest.json"))["version"])')"
            if [ "v${version}" != "${tag}" ]; then
              echo "::error::Tag ${tag} does not match manifest.json version ${version}"; exit 1
            fi
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}    # through the environment: quotes in a title stay text
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file body.md
            else
              echo "Release ${TAG} exists already, leaving it"
            fi
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file body.md --latest \
              || gh release view "${TAG}" > /dev/null   # made by a run that started at the same moment
          fi
