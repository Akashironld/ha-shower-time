name: Release

# Push a tag like v0.11.0 and this publishes the GitHub release, with the notes from CHANGELOG.md.
# It refuses when the tag does not match the version in manifest.json or the changelog has no section for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version and take the release notes from the changelog
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(python3 -c 'import json;print(json.load(open("custom_components/shower_time/manifest.json"))["version"])')"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match manifest.json version ${version}"; exit 1
          fi
          python3 .github/scripts/release_notes.py "${tag}" > notes.md
          echo "title=$(head -n 1 notes.md)" >> "$GITHUB_OUTPUT"
          tail -n +3 notes.md > body.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists already, leaving it"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${{ steps.notes.outputs.title }}" --notes-file body.md --latest
          fi
