name: Feature request
description: An idea to make it more useful
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: input
    id: setup
    attributes:
      label: Your heat pump / boiler (helps to judge if it fits other setups)
