<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- pipe from the top of the tank to the shower head (filled shape: inverted U) -->
  <path d="M 200 116 L 200 82 Q 200 34 248 34 L 350 34 Q 398 34 398 82 L 398 106 L 370 106 L 370 82 Q 370 62 350 62 L 248 62 Q 228 62 228 82 L 228 116 Z" fill="#7b8794"/>
  <!-- shower head -->
  <path d="M 328 112 L 440 112 Q 440 156 398 164 L 370 164 Q 328 156 328 112 Z" fill="#5b6773"/>
  <rect x="322" y="102" width="124" height="18" rx="9" fill="#8b97a3"/>
  <circle cx="362" cy="146" r="5" fill="#3a444e"/>
  <circle cx="384" cy="150" r="5" fill="#3a444e"/>
  <circle cx="406" cy="146" r="5" fill="#3a444e"/>
  <circle cx="373" cy="132" r="4" fill="#3a444e"/>
  <circle cx="395" cy="132" r="4" fill="#3a444e"/>
  <!-- water drops -->
  <path d="M 352 196 Q 338 222 352 232 Q 366 222 352 196 Z" fill="#3d8fe6"/>
  <path d="M 386 214 Q 372 240 386 250 Q 400 240 386 214 Z" fill="#3d8fe6"/>
  <path d="M 420 196 Q 406 222 420 232 Q 434 222 420 196 Z" fill="#3d8fe6"/>
  <path d="M 369 266 Q 355 292 369 302 Q 383 292 369 266 Z" fill="#3d8fe6"/>
  <path d="M 403 284 Q 389 310 403 320 Q 417 310 403 284 Z" fill="#3d8fe6"/>
  <!-- tank outline (drawn as a slightly larger dark shape behind) -->
  <rect x="88" y="104" width="252" height="372" rx="80" ry="80" fill="#2b3640"/>
  <!-- cold water body -->
  <rect x="98" y="114" width="232" height="352" rx="70" ry="70" fill="#3d8fe6"/>
  <!-- darker cold at the very bottom -->
  <path d="M 98 380 L 330 380 L 330 396 Q 330 466 260 466 L 168 466 Q 98 466 98 396 Z" fill="#2f74c4"/>
  <!-- hot layer: rounded top, flat bottom -->
  <path d="M 98 296 L 98 184 Q 98 114 168 114 L 260 114 Q 330 114 330 184 L 330 296 Z" fill="#ff7a33"/>
  <!-- hotter at the very top -->
  <path d="M 98 200 L 98 184 Q 98 114 168 114 L 260 114 Q 330 114 330 184 L 330 200 Z" fill="#ff5530"/>
  <!-- mixing zone between hot and cold -->
  <rect x="98" y="288" width="232" height="16" fill="#ffc38a"/>
  <!-- glass highlight -->
  <rect x="124" y="150" width="20" height="272" rx="10" fill="#ffffff" fill-opacity="0.35"/>
  <!-- feet -->
  <rect x="134" y="470" width="44" height="22" rx="8" fill="#5b6773"/>
  <rect x="250" y="470" width="44" height="22" rx="8" fill="#5b6773"/>
</svg>
