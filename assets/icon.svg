<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg" viewBox="215 145 880 880">
  <defs>
    <linearGradient id="hot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb02e"/><stop offset="0.45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ec2a1f"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#15c0ff"/><stop offset="0.55" stop-color="#1683f0"/><stop offset="1" stop-color="#0a55dc"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7ef"/><stop offset="0.5" stop-color="#b3c1cf"/><stop offset="1" stop-color="#8797a8"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef3"/><stop offset="1" stop-color="#9eabb9"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#127be8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b1f"/><stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <clipPath id="body"><rect x="318" y="312" width="434" height="660" rx="104"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- pipe from the tank to the shower head -->
  <path d="M 540 312 L 540 236 Q 540 190 586 190 L 820 190 Q 866 190 866 236 L 866 318" fill="none" stroke="url(#pipe)" stroke-width="58" stroke-linecap="round"/>
  <path d="M 527 300 L 527 236 Q 527 205 560 202" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>

  <!-- feet -->
  <rect x="390" y="950" width="62" height="64" rx="16" fill="#a9b8c7"/>
  <rect x="617" y="950" width="62" height="64" rx="16" fill="#a9b8c7"/>

  <!-- tank: hot layer on cold, a white wave between -->
  <g filter="url(#shadow)">
    <rect x="306" y="300" width="458" height="684" rx="116" fill="#dbe9f6"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="318" y="312" width="434" height="660" fill="url(#cold)"/>
    <path d="M 318 312 L 752 312 L 752 676 C 680 700 610 712 540 696 C 470 680 400 668 318 690 Z" fill="url(#hot)"/>
    <path d="M 318 690 C 400 668 470 680 540 696 C 610 712 680 700 752 676 L 752 708 C 680 732 610 744 540 728 C 470 712 400 700 318 722 Z" fill="#f3f8fd"/>
    <!-- gloss -->
    <rect x="338" y="350" width="44" height="560" rx="22" fill="#fff" fill-opacity=".28"/>
    <path d="M 360 330 Q 535 300 720 336 L 720 360 Q 535 326 360 356 Z" fill="#fff" fill-opacity=".25"/>
  </g>

  <!-- flame badge -->
  <circle cx="535" cy="585" r="72" fill="#1d2633"/>
  <circle cx="535" cy="585" r="60" fill="#f7f9fb"/>
  <path d="M 535 535 C 556 562 572 582 572 604 C 572 626 555 640 535 640 C 515 640 498 626 498 604 C 498 586 512 572 521 556 C 524 572 530 580 538 584 C 540 566 538 550 535 535 Z" fill="url(#flame)"/>
  <path d="M 535 590 C 546 602 552 610 552 620 C 552 631 544 638 535 638 C 526 638 518 631 518 620 C 518 610 527 602 535 590 Z" fill="#ffb347"/>

  <!-- shower head -->
  <g transform="rotate(8 885 365)">
    <path d="M 765 372 Q 772 304 885 300 Q 998 304 1005 372 Z" fill="url(#head)"/>
    <ellipse cx="885" cy="378" rx="122" ry="40" fill="#25364d"/>
    <ellipse cx="885" cy="370" rx="122" ry="34" fill="none" stroke="#c7d1db" stroke-width="10"/>
    <g fill="#9fb3c8">
      <circle cx="830" cy="380" r="9"/><circle cx="862" cy="370" r="9"/><circle cx="902" cy="368" r="9"/>
      <circle cx="938" cy="378" r="9"/><circle cx="848" cy="396" r="8"/><circle cx="884" cy="392" r="8"/>
      <circle cx="920" cy="396" r="8"/><circle cx="960" cy="388" r="8"/><circle cx="812" cy="392" r="7"/>
    </g>
  </g>

  <!-- drops -->
  <g fill="url(#drop)">
    <path d="M 828 446 C 840 470 852 486 852 500 C 852 514 841 524 828 524 C 815 524 804 514 804 500 C 804 486 816 470 828 446 Z"/>
    <path d="M 950 446 C 965 476 980 496 980 514 C 980 532 966 546 950 546 C 934 546 920 532 920 514 C 920 496 935 476 950 446 Z"/>
    <path d="M 878 520 C 896 556 914 580 914 602 C 914 624 898 642 878 642 C 858 642 842 624 842 602 C 842 580 860 556 878 520 Z"/>
    <path d="M 958 608 C 972 634 986 652 986 668 C 986 684 973 698 958 698 C 943 698 930 684 930 668 C 930 652 944 634 958 608 Z"/>
  </g>
  <g fill="#fff" fill-opacity=".55">
    <ellipse cx="818" cy="498" rx="5" ry="11"/><ellipse cx="938" cy="512" rx="6" ry="13"/>
    <ellipse cx="864" cy="598" rx="7" ry="16"/><ellipse cx="947" cy="664" rx="5" ry="11"/>
  </g>
</svg>
